steps:
  - name: "gcr.io/cloud-builders/docker"
    id: Build
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mta-countdown:$COMMIT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: Push
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mta-countdown:$COMMIT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: Deploy
    entrypoint: gcloud
    args:
      - "run"
      - "services"
      - "update"
      - "mta-countdown"
      - "--platform=managed"
      - "--region=us-central1"
      - "--max-instances=1"
      - "--min-instances=0"
      - "--image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mta-countdown:$COMMIT_SHA"
      - "--quiet"

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mta-countdown:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
